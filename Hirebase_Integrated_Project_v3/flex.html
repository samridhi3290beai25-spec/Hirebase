<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Mobile First Demo</title>
    <link rel="stylesheet" href="flex.css">
    <style>
    .square {
        width: 20px;
        height: 20px;
        background: red;
        position: relative;
        animation: mymoves 5s infinite;
    }

    @keyframes mymoves {
        0% {
            left: 0px;
            top: 0px;
        }

        25% {
            left: 300px;
            top: 0px;
        }

        50% {
            left: 300px;
            top: 200px;
        }

        75% {
            left: 0px;
            top: 200px;
        }

        100% {
            left: 0px;
            top: 0px;
        }
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="box square"></div>
        <div class="box">Box 2</div>
    </div>
</body>
</html>
